<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Maskable-safe dark green background -->
  <rect width="512" height="512" fill="#1E3A0E"/>
  <!-- Plant centered in 60% safe area (~205px wide), scale of 8x from 32px viewBox -->
  <!-- Original favicon transformed: translate to center then scale 8x -->
  <g transform="translate(128 128) scale(8)">
    <!-- Soil -->
    <rect x="2" y="22" width="28" height="8" rx="2" fill="#8B6914"/>
    <rect x="4" y="24" width="4" height="2" fill="#6B4F10"/>
    <rect x="12" y="26" width="4" height="2" fill="#6B4F10"/>
    <rect x="22" y="24" width="4" height="2" fill="#6B4F10"/>
    <!-- Stem -->
    <rect x="15" y="8" width="2" height="14" fill="#4A7025"/>
    <!-- Leaves -->
    <rect x="11" y="12" width="4" height="2" fill="#6BCB77"/>
    <rect x="17" y="10" width="4" height="2" fill="#6BCB77"/>
    <rect x="11" y="16" width="4" height="2" fill="#5CB868"/>
    <!-- Flower/fruit -->
    <rect x="13" y="4" width="6" height="6" rx="1" fill="#FF6B6B"/>
    <rect x="15" y="2" width="2" height="2" fill="#FFD700"/>
    <rect x="11" y="4" width="2" height="2" fill="#FFD700"/>
    <rect x="19" y="4" width="2" height="2" fill="#FFD700"/>
    <rect x="15" y="8" width="2" height="2" fill="#FFD700"/>
  </g>
</svg>
